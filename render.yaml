# --- Blueprint Render : Mon Miam Miam complet (API Laravel + frontend React) ---
# Une SEULE image Docker (Dockerfile a la racine du depot) sert le site entier :
# le bundle React est dans public/ et les routes /api vont a Laravel (meme origine,
# pas de CORS, pas de proxy d images).
#
# Mise en route (une seule fois) :
#   Option A : Dashboard Render > New > Blueprint > choisir ce depot GitHub
#              (build automatique depuis le Dockerfile, deploiement a chaque push).
#   Option B : sans lien GitHub : New > Web Service > "Deploy an existing image"
#              avec l'image ghcr.io/kamgaolive3-crypto/projet-dev-web-groupe8:latest
#              publiee par la CI GitHub Actions.
services:
  - type: web
    name: mon-miam-miam
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /up
    envVars:
      # Cle de chiffrement Laravel : Render la genere une seule fois (stable)
      - key: APP_KEY
        generateValue: true
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        value: https://mon-miam-miam.onrender.com
      # Base SQLite incluse dans le conteneur (voir Dockerfile + entrypoint)
      - key: DB_CONNECTION
        value: sqlite
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: file
      - key: QUEUE_CONNECTION
        value: database
      # Pas de serveur mail en production de demo : les mails partent dans les logs
      - key: MAIL_MAILER
        value: log
