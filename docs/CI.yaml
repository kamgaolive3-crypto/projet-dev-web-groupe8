#copier ce fichier dans .github/workflows/ci.yml (interface GitHub : bouton Web disponible sur le repo)
name: CI Mon Miam Miam

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Tests Laravel (app/backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Dependances
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Preparation
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate
      - name: Migration + seed (validation structure)
        run: php artisan migrate:fresh --seed --force
      - name: Tests
        run: php artisan test

  frontend:
    name: Build React (app/frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dependances
        run: npm ci
      - name: Build de production
        run: npm run build
