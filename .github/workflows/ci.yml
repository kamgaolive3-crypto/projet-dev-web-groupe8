#copier ce fichier dans .github/workflows/ci.yml (interface GitHub : bouton Web disponible sur le repo)
name: CI Mon Miam Miam

on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]

jobs:
  backend:
    name: Tests Laravel (app/backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.2"
          extensions: mbstring, pdo_sqlite, sqlite3
          coverage: none
      - name: Dependances
        run: composer install --prefer-dist --no-interaction --no-progress
      - name: Preparation
        run: |
          php -r "file_exists('.env') || copy('.env.example', '.env');"
          php artisan key:generate
      - name: Migration + seed (validation structure)
        run: php artisan migrate:fresh --seed --force
      - name: Tests
        run: php artisan test

  frontend:
    name: Build React (app/frontend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Dependances
        run: npm ci
      - name: Build de production
        run: npm run build

  docker:
    name: Validation image Docker (backend)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app/backend
    steps:
      - uses: actions/checkout@v4
      - name: Construction de l'image
        run: docker build -t mon-miam-miam-api:ci .

  deploy:
    name: Deploiement automatique (CD)
    needs: [backend, frontend, docker]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
    steps:
      - name: Deploiement du backend sur Render
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Declenchement du deploiement Render (API backend)..."
            curl --fail --silent --show-error -X POST "$RENDER_DEPLOY_HOOK"
          else
            echo "::notice::Secret RENDER_DEPLOY_HOOK absent - si Render est connecte au depot, le deploiement se fait automatiquement au push."
          fi
      - name: Deploiement du frontend sur Vercel
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            echo "Declenchement du deploiement Vercel (frontend)..."
            curl --fail --silent --show-error -X POST "$VERCEL_DEPLOY_HOOK"
          else
            echo "::notice::Secret VERCEL_DEPLOY_HOOK absent - si Vercel est connecte au depot, le deploiement se fait automatiquement au push."
          fi
